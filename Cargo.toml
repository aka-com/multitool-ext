[workspace]
resolver = "2"
members = ["crates/aka-api", "crates/aka-client", "crates/aka-core", "crates/multitool", "crates/aka-sandbox", "src-tauri"]
default-members = ["crates/aka-api", "crates/aka-client", "crates/aka-core", "crates/multitool", "crates/aka-sandbox"]
# src-tauri is a workspace member so a single Cargo.lock covers the whole tree,
# which lets Bazel's crate_universe resolve one dependency graph (crate.from_cargo
# in MODULE.bazel) instead of two. It only *builds* where the platform webview
# toolchain exists (macOS; Linux needs webkit2gtk), so on Linux build/test the
# core and CLI crates by package (`-p`) rather than the whole workspace.

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aka-api = { path = "crates/aka-api" }
aka-client = { path = "crates/aka-client" }
aka-core = { path = "crates/aka-core" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
zeroize = "1"
base64 = "0.22"
percent-encoding = "2"
dirs = "6"
libc = "0.2"
tempfile = "3"
getrandom = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower = "0.5"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"

# Postgres proxy
postgres-protocol = "0.6"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "0.26"
md-5 = "0.10"
pbkdf2 = "0.12"
chacha20poly1305 = "0.10"
tokio-postgres = "0.7"

# SSH agent adapter
# "encryption" is for *import*: a passphrase-protected key is decrypted once,
# in the trusted onboarding surface, and the decrypted OpenSSH form is what the
# vault seals. It brings in bcrypt-pbkdf and the AES/ChaCha ciphers OpenSSH uses
# for `-o KDF=bcrypt`.
# `p256`/`p384` are what make ECDSA keys *signable*: the bare `ecdsa`
# feature only parses them, so without these a user's ECDSA key imported
# fine and then failed at the first login.
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "rsa", "ecdsa", "p256", "p384", "encryption"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
signature = "2"

# Passkey sign-in. The relying-party half of WebAuthn only: challenge
# generation, and verification of what the browser signs. MPL-2.0, which is
# file-level copyleft and so does not reach this tree; it is the one
# maintained Rust implementation of a protocol that is unforgiving to
# hand-roll.
#
# Pinned to the 0.6 line, and exactly, for one reason: 0.5 verifies through
# native OpenSSL, and `multitool` cross-compiles to both Linux targets with
# zig (see scripts/npm-dist.sh). openssl-sys would need a cross-built OpenSSL
# per target in a tree that is otherwise pure-Rust and rustls-only. 0.6
# replaced it with RustCrypto, so it cross-compiles with everything else. The
# cost is a version upstream still labels `-dev`, hence the exact pin: this
# must not drift underneath a security-critical path without a deliberate
# bump.
#
# Ceremony state is deliberately *not* serialized (no
# `danger-allow-state-serialisation`): a challenge is one-use and expiring, so
# it lives in memory and dies with the process rather than on disk.
webauthn-rs = { version = "=0.6.1-dev", features = ["resident-key-support"] }

clap = { version = "4", features = ["derive"] }
clap_complete = "4"
cliclack = "0.5"
comfy-table = { version = "7", default-features = false }
anstyle = "1"

# Test-only: generates the CA and leaf certificates the Postgres TLS tests
# need. Never built into a shipped binary.
rcgen = "0.14"
