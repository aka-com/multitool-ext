<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Multitool</title>
<style nonce="__NONCE__">
  :root {
    color-scheme: light dark;
    --bg: #fbfbfc; --fg: #17181c; --muted: #6b7078;
    --line: #e3e5e9; --card: #ffffff; --accent: #2f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --fg: #eceef2; --muted: #9aa0a8;
      --line: #2b2d33; --card: #1d1f23; --accent: #6a9bff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg); padding: 24px;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main {
    width: 100%; max-width: 26rem; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 28px;
  }
  h1 { font-size: 1.15rem; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 16px; }
  .detail, .muted { color: var(--muted); font-size: 0.9rem; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85em; background: color-mix(in srgb, var(--fg) 7%, transparent);
    padding: 1px 5px; border-radius: 4px;
  }
  button {
    font: inherit; font-weight: 500; width: 100%; padding: 10px 16px;
    border-radius: 8px; border: 1px solid transparent; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  .device {
    display: flex; gap: 10px; align-items: baseline; margin: 0 0 20px;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
  }
  .device b { font-weight: 600; }
  .error { color: #c0392b; margin: 14px 0 0; font-size: 0.9rem; }
  @media (prefers-color-scheme: dark) { .error { color: #ff8a7a; } }
</style>
</head>
<body>
<main>
<!--BODY-->
</main>
</body>
</html>
